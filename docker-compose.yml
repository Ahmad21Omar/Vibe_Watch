# The whole application: three services.
#
#   ui  (Streamlit, :8501)  ->  api  (FastAPI, :8000)  ->  qdrant  (:6333)
#
# The UI is an ordinary client of the API -- it has no private path into the pipeline, so
# using the app exercises exactly the contract every other consumer gets.
#
# Start everything:  docker compose up -d --build   ->  UI at http://localhost:8501
#                                                       API docs at :8000/docs
# Only the database: docker compose up -d qdrant    ->  what the local dev setup needs
# Stop:              docker compose down
#
# Qdrant's dashboard stays available at http://localhost:6333/dashboard either way.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vibewatch-qdrant
    ports:
      - "6333:6333"   # REST API + web dashboard
      - "6334:6334"   # gRPC (faster connection, optional, used later)
    volumes:
      # Persist the vectors on disk so they survive a container restart.
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: vibewatch-api
    command: uvicorn vibewatch.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    # Keys come from .env at RUN time -- never copied into the image (see .dockerignore).
    env_file: .env
    environment:
      # Overrides whatever .env says: inside the compose network the database is reachable
      # under its SERVICE NAME, not localhost -- localhost in a container is the container.
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped

  ui:
    build: .
    container_name: vibewatch-ui
    # Same image, different process. One build, two roles -- and no chance of the UI
    # running against a different version of the code than the API.
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
