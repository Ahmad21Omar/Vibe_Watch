# Central project configuration. The modern, standard place for project metadata and
# per-tool settings (PEP 518/621) -- one file instead of setup.py + pytest.ini + ...

[project]
name = "vibewatch"
version = "0.1.0"
description = "Semantic movie & TV recommender built with RAG (Gemini + Qdrant)."
requires-python = ">=3.12"

[tool.ruff]
# Slightly wider than the default 88: this codebase explains itself in comments, and
# wrapping a sentence twice costs more readability than the extra columns.
line-length = 100
extend-exclude = [".venv", "qdrant_storage", "data"]

[tool.ruff.lint]
# E/F  pycodestyle + pyflakes (the basics: syntax, unused names, style)
# I    import sorting -- keeps diffs free of import churn
# UP   pyupgrade: use modern Python idioms (we target 3.12)
# B    bugbear: real bug patterns, e.g. mutable default arguments
# C4   comprehension clean-ups
# RUF  ruff's own checks, e.g. unused noqa directives
# Deliberately NOT enabled: BLE (blind except). We catch bare `Exception` in exactly two
# places -- the UI's error banner and the integration-test skip guard -- where the point
# IS to survive any failure, and a silenced-warning comment on each would add noise.
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]

[tool.pytest.ini_options]
# Look for tests here by default, so a bare `pytest` finds them.
testpaths = ["tests"]
# Put the project root on sys.path so `from vibewatch... import ...` resolves.
# NOT redundant: `python -m pytest` adds the current directory to sys.path automatically,
# but the `pytest` command does not -- so without this line the suite passes locally and
# fails in CI with "No module named 'vibewatch'". (It did exactly that.) The alternative
# is packaging the project and installing it with `pip install -e .`; this is the smaller
# change and keeps `git clone && pytest` working with no install step.
pythonpath = ["."]
# -q = quiet output; -ra = short summary of anything not passing.
# -m 'not integration' keeps a bare `pytest` fast and pure: integration tests hit live
# Qdrant + Gemini and are opt-in via `pytest -m integration`.
addopts = "-q -ra -m 'not integration'"
markers = [
    "integration: exercises live services (Qdrant + Gemini API); deselected by default, run with `pytest -m integration`",
]
